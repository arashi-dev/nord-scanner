name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-x86_64"
            os: windows-latest
          - platform: "macos-x86_64"
            os: macos-latest
          - platform: "linux-x86_64"
            os: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build and Publish Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nord Scanner ${{ github.ref_name }}"
          releaseBody: "Automated release build for Nord Scanner (${{ github.ref_name }})."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Build TUI Binary
        shell: bash
        run: |
          mkdir -p tui-dist
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            cargo build --release --bin nord-scanner-cli
            cp target/release/nord-scanner-cli.exe tui-dist/nord-scanner-cli.exe
            cd tui-dist
            7z a nord-scanner-tui-windows-x86_64.zip nord-scanner-cli.exe
            tar -czvf nord-scanner-tui-windows-x86_64.tar.gz nord-scanner-cli.exe
            cd ..
          elif [ "${{ matrix.platform }}" = "linux-x86_64" ]; then
            cargo build --release --bin nord-scanner-cli
            cp target/release/nord-scanner-cli tui-dist/nord-scanner-cli
            chmod +x tui-dist/nord-scanner-cli
            cd tui-dist
            tar -czvf nord-scanner-tui-linux-x86_64.tar.gz nord-scanner-cli
            cd ..
          elif [ "${{ matrix.platform }}" = "macos-x86_64" ]; then
            cargo build --release --bin nord-scanner-cli --target x86_64-apple-darwin
            cargo build --release --bin nord-scanner-cli --target aarch64-apple-darwin
            lipo -create -output tui-dist/nord-scanner-cli \
              target/x86_64-apple-darwin/release/nord-scanner-cli \
              target/aarch64-apple-darwin/release/nord-scanner-cli
            chmod +x tui-dist/nord-scanner-cli
            cd tui-dist
            tar -czvf nord-scanner-tui-macos-universal.tar.gz nord-scanner-cli
            cd ..
          fi

      - name: Upload TUI Archive to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" tui-dist/* --clobber

  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Configure Android NDK
        run: |
          if [ -z "$ANDROID_NDK_HOME" ]; then
            NDK_PATH=$(ls -d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
          else
            NDK_PATH="$ANDROID_NDK_HOME"
          fi
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "Using NDK at: $NDK_PATH"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Install Node dependencies
        run: npm ci

      - name: Configure Android Signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            printf "storeFile=%s\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
              "$RUNNER_TEMP/release.jks" \
              "$ANDROID_KEYSTORE_PASSWORD" \
              "$ANDROID_KEY_ALIAS" \
              "$ANDROID_KEY_PASSWORD" > src-tauri/gen/android/keystore.properties
            echo "Keystore successfully configured in src-tauri/gen/android/keystore.properties"
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not found, skipping keystore decode."
          fi

      - name: Build Android APK
        run: npx @tauri-apps/cli android build --apk --split-per-abi --target aarch64 --target armv7 --target x86_64
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}

      - name: Collect Android APKs
        shell: bash
        run: |
          mkdir -p android-dist
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f -exec cp {} android-dist/ \;
          ls -la android-dist/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: android-dist/*.apk
          retention-days: 1

  publish-android:
    name: Publish Android APKs to Release
    runs-on: ubuntu-latest
    needs: [release-desktop, build-android]
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: android-dist

      - name: Upload APKs to GitHub Release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -la android-dist/
          gh release upload "${{ github.ref_name }}" android-dist/*.apk --repo "${{ github.repository }}" --clobber
