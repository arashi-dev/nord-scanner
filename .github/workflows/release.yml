name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-x86_64"
            os: windows-latest
          - platform: "macos-x86_64"
            os: macos-latest
          - platform: "linux-x86_64"
            os: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-x86_64' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node dependencies
        run: npm ci

      - name: Build and Publish Tauri Desktop App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Nord Scanner ${{ github.ref_name }}"
          releaseBody: "Automated release build for Nord Scanner (${{ github.ref_name }})."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true

      - name: Build TUI Binary
        shell: bash
        run: |
          mkdir -p tui-dist
          if [ "${{ matrix.platform }}" = "windows-x86_64" ]; then
            cargo build --release --bin nord-scanner-cli
            cp target/release/nord-scanner-cli.exe tui-dist/nord-scanner-cli.exe
            cd tui-dist
            7z a nord-scanner-tui-windows-x86_64.zip nord-scanner-cli.exe
            tar -czvf nord-scanner-tui-windows-x86_64.tar.gz nord-scanner-cli.exe
            cd ..
          elif [ "${{ matrix.platform }}" = "linux-x86_64" ]; then
            cargo build --release --bin nord-scanner-cli
            cp target/release/nord-scanner-cli tui-dist/nord-scanner-cli
            chmod +x tui-dist/nord-scanner-cli
            cd tui-dist
            tar -czvf nord-scanner-tui-linux-x86_64.tar.gz nord-scanner-cli
            cd ..
          elif [ "${{ matrix.platform }}" = "macos-x86_64" ]; then
            cargo build --release --bin nord-scanner-cli --target x86_64-apple-darwin
            cargo build --release --bin nord-scanner-cli --target aarch64-apple-darwin
            lipo -create -output tui-dist/nord-scanner-cli \
              target/x86_64-apple-darwin/release/nord-scanner-cli \
              target/aarch64-apple-darwin/release/nord-scanner-cli
            chmod +x tui-dist/nord-scanner-cli
            cd tui-dist
            tar -czvf nord-scanner-tui-macos-universal.tar.gz nord-scanner-cli
            cd ..
          fi

      - name: Upload TUI Archive to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            tui-dist/nord-scanner-tui-*.tar.gz
            tui-dist/nord-scanner-tui-*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    needs: release-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Android NDK
        run: |
          echo "y" | sdkmanager "ndk;25.2.9519653"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Install Node dependencies
        run: npm ci

      - name: Decode Android Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "Keystore successfully decoded to $RUNNER_TEMP/release.jks"
          else
            echo "ANDROID_KEYSTORE_BASE64 secret not found, skipping keystore decode."
          fi

      - name: Build Android APK
        run: npx @tauri-apps/cli android build --apk
        env:
          NDK_HOME: ${{ env.ANDROID_NDK_ROOT }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APKs to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/arm64-v8a/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/armeabi-v7a/release/*.apk
            src-tauri/gen/android/app/build/outputs/apk/x86_64/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
